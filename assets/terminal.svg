    text { font-family: 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', Menlo, monospace; font-size: 15px; }
.ln { opacity: 0; animation: show .01s linear both; } @keyframes show { to { opacity: 1; } }
.caret { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
@keyframes tp0 { from { width: 0; } to { width: 58.2px; } }
@keyframes tp2 { from { width: 0; } to { width: 130.4px; } }
@keyframes tp6 { from { width: 0; } to { width: 112.4px; } }
@keyframes tp8 { from { width: 0; } to { width: 94.3px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ln, .note, .row { opacity: 1 !important; } }
