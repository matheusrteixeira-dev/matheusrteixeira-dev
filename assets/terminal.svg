text x="30" y="215" fill="#c9d3f2" xml:space="preserve">M.Sc. in Electrical Engineering (AI) and B.Sc. in Computer Science @ FEI</text></g><clipPath id="c6"><rect class="type" x="183.5" y="223" height="27" width="112.4" style="animation: tp6 0.79s steps(12) 3.22s both"/></clipPath><g class="ln" style="animation-delay:3.02s"><text x="30" y="242" xml:space="preserve"><tspan fill="#5cff9d">matheus@orbit</tspan><tspan fill="#9fb4ff">:</tspan><tspan fill="#22e6ff">~</tspan><tspan fill="#9fb4ff">$ </tspan></text></g><text x="183.5" y="242" fill="#f2f5ff" clip-path="url(#c6)">ls ~/shipped</text><g class="ln" style="animation-delay:4.36s"><text x="30" y="269" fill="#ffb15c" xml:space="preserve">isaac3d.com/   amadeosheets.com/   allwinner/   brectus/   quantum-ml-healthcare/</text></g><clipPath id="c8"><rect class="type" x="183.5" y="277" height="27" width="94.3" style="animation: tp8 0.70s steps(10) 4.54s both"/></clipPath><g class="ln" style="animation-delay:4.34s"><text x="30" y="296" xml:space="preserve"><tspan fill="#5cff9d">matheus@orbit</tspan><tspan fill="#9fb4ff">:</tspan><tspan fill="#22e6ff">~</tspan><tspan fill="#9fb4ff">$ </tspan></text></g><text x="183.5" y="296" fill="#f2f5ff" clip-path="url(#c8)">echo $LANG</text><g class="ln" style="animation-delay:5.59s"><text x="30" y="323" fill="#c9d3f2" xml:space="preserve">pt_BR.UTF-8 (native)   en_US.UTF-8 (C2, EF SET 92/100)</text></g><g class="ln" style="animation-delay:5.77s"><text x="30" y="350" xml:space="preserve"><tspan fill="#5cff9d">matheus@orbit</tspan><tspan fill="#9fb4ff">:</tspan><tspan fill="#22e6ff">~</tspan><tspan fill="#9fb4ff">$ </tspan></text><rect class="caret" x="183.5" y="335" width="9" height="19" fill="#22e6ff"/></g>
