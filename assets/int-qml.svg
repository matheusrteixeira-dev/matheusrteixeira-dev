<svg xmlns="http://www.w3.org/2000/svg" width="280" height="44" viewBox="0 0 280 44" role="img" aria-labelledby="t d">
  <title id="t">Quantum Machine Learning</title>
  <desc id="d">Quantum Machine Learning</desc>
  <style>
    .tw { animation: tw 4s ease-in-out infinite; } .tw1 { animation-delay: 1.3s; } .tw2 { animation-delay: 2.6s; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .95; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; } @keyframes ping { from { transform: scale(1); opacity: .8; } 60%,100% { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ln, .note, .row { opacity: 1 !important; } }
  </style>
  <defs>
