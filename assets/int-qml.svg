    <linearGradient id="hudG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e6ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
    <clipPath id="frame"><rect width="280" height="44" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
