    <circle cx="41.5" cy="27.1" r="0.7" fill="#dfe8ff" opacity="0.58"/><circle cx="51.1" cy="12.9" r="1.1" fill="#dfe8ff" opacity="0.59" class="tw tw1"/><circle cx="148.4" cy="27.3" r="1.4" fill="#dfe8ff" opacity="0.78" class="tw tw2"/><circle cx="221.4" cy="19.4" r="1.4" fill="#dfe8ff" opacity="0.33"/><circle cx="193.1" cy="26.8" r="1.1" fill="#dfe8ff" opacity="0.79"/><circle cx="200.0" cy="23.1" r="1.1" fill="#dfe8ff" opacity="0.62"/>
