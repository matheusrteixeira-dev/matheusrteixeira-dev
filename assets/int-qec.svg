    <circle cx="40.8" cy="20.0" r="0.7" fill="#dfe8ff" opacity="0.67"/><circle cx="121.4" cy="35.2" r="1.4" fill="#dfe8ff" opacity="0.32"/><circle cx="73.8" cy="29.0" r="0.7" fill="#dfe8ff" opacity="0.45"/><circle cx="215.0" cy="9.0" r="0.7" fill="#dfe8ff" opacity="0.33"/><circle cx="103.6" cy="18.0" r="0.7" fill="#dfe8ff" opacity="0.49"/><circle cx="77.2" cy="34.9" r="1.1" fill="#dfe8ff" opacity="0.35"/>
    <circle cx="24" cy="22" r="5" fill="#ffd79a"/><circle cx="24" cy="22" r="5" fill="none" stroke="#ffd79a" class="ping" style="animation-delay:0.0s"/><text x="40" y="27" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', Menlo, monospace" font-size="15" fill="#ffd79a">Quantum Error Correction</text>
    <rect x=".5" y=".5" width="279" height="43" rx="22" fill="none" stroke="#ffd79a" stroke-opacity=".45"/>
