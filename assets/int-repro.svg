    <circle cx="222.2" cy="15.4" r="0.5" fill="#dfe8ff" opacity="0.82"/><circle cx="194.4" cy="14.7" r="0.7" fill="#dfe8ff" opacity="0.76" class="tw tw1"/><circle cx="225.0" cy="4.4" r="1.1" fill="#dfe8ff" opacity="0.46" class="tw tw2"/><circle cx="108.8" cy="17.0" r="1.1" fill="#dfe8ff" opacity="0.55"/><circle cx="171.2" cy="31.1" r="0.7" fill="#dfe8ff" opacity="0.62"/><circle cx="206.6" cy="23.1" r="0.9" fill="#dfe8ff" opacity="0.29"/>
